# Estimator hyperparameters for conditional performance models.
# Which models to run: config.py → MODEL_RUN

random_state: 42
min_train_rows: 3 # skip fit/select when rolling train fold is smaller
standardize: true # fit StandardScaler on train fold only

params:
  hgb: # sklearn.ensemble.HistGradientBoostingRegressor
    loss: squared_error # squared_error | absolute_error | poisson | ...
    learning_rate: 0.1
    max_iter: 100
    max_depth: 3
    max_leaf_nodes: 31
    min_samples_leaf: 5
    l2_regularization: 0.0
    early_stopping: false
  ridge: # sklearn.linear_model.Ridge
    alpha: 1.0
    fit_intercept: true
    solver: auto # auto | svd | cholesky | lsqr | sparse_cg | sag | saga
  rf: # sklearn.ensemble.RandomForestRegressor
    n_estimators: 100
    criterion: squared_error # squared_error | absolute_error | friedman_mse | poisson
    max_depth: 4
    min_samples_split: 2
    min_samples_leaf: 2
    max_features: 1.0 # float in (0, 1] or sqrt | log2 | null
    bootstrap: true
    n_jobs: -1
