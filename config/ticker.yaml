# Preset ETF universes. Choose one in config.py → TICKER_SET.
# Names must exist on yfinance. A list Dirichlet alpha must match the chosen set.

sets:
  # Current basket: US large-cap equity, long Treasuries, and gold.
  etf_3:
    - SPY
    - TLT
    - GLD

  # Smallest multi-asset set. Keeps the three and adds developed ex-US equity and US aggregate bonds.
  etf_5:
    - SPY
    - TLT
    - GLD
    - EFA
    - AGG

  # Main research universe: equity, Treasuries, credit, real estate, gold, and commodities.
  etf_10:
    - SPY
    - TLT
    - GLD
    - EFA
    - AGG
    - IWM
    - EEM
    - VNQ
    - HYG
    - DBC

  # Between the 10-asset research set and the broader regime set. Adds a few US styles, three markets, bond sleeves, silver, and the dollar.
  etf_25:
